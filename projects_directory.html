---
layout: default
title: Interactive Projects Directory
---

<div class="container">
  <h1>Interactive GSoC Projects Directory</h1>
  <p>Search and filter past and present GSoC projects from HumanAI Foundation / ML4SCI.</p>

  <div class="search-container" style="margin-bottom: 20px;">
    <input type="text" id="searchInput" placeholder="Search for projects, descriptions, or keywords..." style="width: 100%; padding: 10px; font-size: 16px;">
  </div>

  <div id="projectsList" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px;">
    <!-- Projects will be rendered here via JavaScript -->
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
  let allProjects = [];
  const searchInput = document.getElementById("searchInput");
  const projectsList = document.getElementById("projectsList");

  // Fetch the dynamic JSON endpoint generated by Jekyll
  fetch("{{ site.baseurl }}/projects.json")
    .then(response => response.json())
    .then(data => {
      allProjects = data;
      renderProjects(allProjects);
    })
    .catch(error => console.error("Error fetching projects:", error));

  searchInput.addEventListener("input", function(e) {
    const term = e.target.value.toLowerCase();
    const filtered = allProjects.filter(project => {
      const titleMatch = project.title && project.title.toLowerCase().includes(term);
      const descMatch = project.description && project.description.toLowerCase().includes(term);
      return titleMatch || descMatch;
    });
    renderProjects(filtered);
  });

  function renderProjects(projects) {
    projectsList.innerHTML = "";
    if (projects.length === 0) {
      projectsList.innerHTML = "<p>No projects found matching your search.</p>";
      return;
    }
    
    projects.forEach(project => {
      const card = document.createElement("div");
      card.style.border = "1px solid #ccc";
      card.style.padding = "15px";
      card.style.borderRadius = "8px";
      card.style.boxShadow = "2px 2px 8px rgba(0,0,0,0.1)";
      
      const title = document.createElement("h3");
      const link = document.createElement("a");
      link.href = project.url;
      link.textContent = project.title || "Untitled Project";
      title.appendChild(link);
      
      const desc = document.createElement("p");
      // Truncate description for the card
      const fullDesc = project.description || "";
      desc.textContent = fullDesc.length > 150 ? fullDesc.substring(0, 150) + "..." : fullDesc;
      
      card.appendChild(title);
      card.appendChild(desc);
      projectsList.appendChild(card);
    });
  }
});
</script>
